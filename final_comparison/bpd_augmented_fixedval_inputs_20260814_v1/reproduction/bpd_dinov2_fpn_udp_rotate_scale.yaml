# ---------------------------------------------------------------
# MODIFIED: bpd_deconv_v2_fpn_udp_loaderseed.yaml + rotate_augment: true +
# scale_augment: true — DINOv2 counterpart of bpd_dinov3_fpn_udp_rotate_scale.yaml.
#
# Why this exists even though DINOv3's full HRNet-aligned recipe (rotation
# ±30° + scale ±25%) didn't beat the no-augment ensemble (9.54%): this
# project has repeatedly shown DINOv2 and DINOv3 do NOT behave the same way
# under the same intervention (EMA: -2.59pt on DINOv2 vs -1.08pt on DINOv3;
# BPD single-model-vs-ensemble and OFD single-model-vs-ensemble both flip
# direction between the two backbones). Assuming the DINOv3 augmentation
# result transfers to DINOv2 without testing it would be an unsupported
# extrapolation this project's own evidence argues against — and DINOv2 is
# the paper's primary/main backbone, so its augmentation behavior needs a
# direct answer, not an inference from a secondary backbone.
#
# ONLY difference from bpd_deconv_v2_fpn_udp_loaderseed.yaml:
# data.init_args.rotate_augment / scale_augment. Everything else (backbone,
# loss, LR schedule, FPN layers, sigma, loader_seed) held fixed.
#
# Reference: DINOv2 FPN+UDP (no augment) ensemble = 9.75%, single-model
# last = 14.68%±2.13%. HRNet baseline = 8.00%.
# ---------------------------------------------------------------

seed_everything: 2024

trainer:
  max_epochs: 200
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: metrics/val_nme
        mode: min
        save_top_k: 1
        save_last: true
        dirpath: checkpoints/bpd-dinov2-fpn-udp-rotate-scale
        filename: bpd-dinov2-fpn-udp-rotate-scale_best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: metrics/val_nme
        mode: min
        patience: 20
        min_delta: 0.005
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: eomt-landmark
      name: bpd-dinov2-fpn-udp-rotate-scale
      save_dir: logs
      log_model: false

model:
  class_path: training.landmark_detection.LandmarkDetection
  init_args:
    num_landmarks: 2
    loss_type: hybrid
    alpha: 5.0
    temperature: 10.0
    lambda_coord: 0.1
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: null
    attn_mask_annealing_end_steps: null
    lr: 1.0e-4
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1.0
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps: [15, 30]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_classes: 1
        num_q: 2
        num_blocks: 3
        masked_attn_enabled: true
        freeze_backbone: false
        upsample_bilinear: false
        use_refinement_head: false
        heatmap_head: deconv_v2
        heatmap_size: [64, 64]
        use_fpn: true
        fpn_layers: [4, 8, 12]
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_reg4_dinov2

data:
  class_path: datasets.landmark_dataset.HeadLandmarkDataModule
  init_args:
    images_dir: /root/autodl-tmp/images/UCL/Head
    ann_train_csv: /root/autodl-tmp/annotations/UCL/Head_Train.csv
    ann_test_csv: /root/autodl-tmp/annotations/UCL/Head_Test.csv
    task: bpd
    img_size: [512, 512]
    heatmap_size: [64, 64]
    sigma: 4.0
    val_fraction: 0.1
    val_split_seed: 42
    batch_size: 16
    num_workers: 4
    pixel_center_align: true
    rotate_augment: true
    scale_augment: true
    loader_seed: 2024
