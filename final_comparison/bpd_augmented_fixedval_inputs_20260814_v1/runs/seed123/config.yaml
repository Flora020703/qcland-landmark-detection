seed_everything: 123
trainer:
  max_epochs: 200
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: metrics/val_nme
      mode: min
      save_top_k: 1
      save_last: true
      dirpath: /root/autodl-tmp/saved_checkpoints/bpd_deconv_v2_rotate_scale_fixedval_5seed_v3/bpd_deconv_v2_rotate_scale_fixedval/seed123
      filename: seed123_best
  - class_path: lightning.pytorch.callbacks.EarlyStopping
    init_args:
      monitor: metrics/val_nme
      mode: min
      patience: 20
      min_delta: 0.005
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: step
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: eomt-landmark
      name: bpd-deconv-v2-rotate-scale-seed123
      save_dir: logs
      log_model: false
model:
  class_path: training.landmark_detection.LandmarkDetection
  init_args:
    num_landmarks: 2
    loss_type: hybrid
    alpha: 5.0
    temperature: 10.0
    lambda_coord: 0.1
    endpoint_order_invariant_nme: false
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: null
    attn_mask_annealing_end_steps: null
    lr: 0.0001
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1.0
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps:
    - 15
    - 30
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_classes: 1
        num_q: 2
        num_blocks: 3
        masked_attn_enabled: true
        freeze_backbone: false
        upsample_bilinear: false
        use_refinement_head: false
        heatmap_head: deconv_v2
        heatmap_size:
        - 64
        - 64
        use_fpn: false
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_reg4_dinov2
data:
  class_path: datasets.landmark_dataset.HeadLandmarkDataModule
  init_args:
    images_dir: /root/autodl-tmp/images/UCL/Head
    ann_train_csv: /root/autodl-tmp/annotations/UCL/Head_Train.csv
    ann_test_csv: /root/autodl-tmp/annotations/UCL/Head_Test.csv
    task: bpd
    img_size:
    - 512
    - 512
    heatmap_size:
    - 64
    - 64
    sigma: 4.0
    val_fraction: 0.1
    val_split_seed: 42
    batch_size: 16
    num_workers: 4
    pixel_center_align: false
    rotate_augment: true
    scale_augment: true
    loader_seed: 123
