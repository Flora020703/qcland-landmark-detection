# ---------------------------------------------------------------
# MODIFIED: 300W data-efficiency ablation, rung 1/4 — baseline (deconv_v2
# only, no FPN/UDP/EMA).
#
# Purpose: this 4-rung ablation (baseline -> +FPN -> +FPN+UDP -> +FPN+UDP+EMA)
# is NOT primarily about closing the gap to HRNet - it's testing whether the
# cross-dataset finding from BPD/HC18 ("FPN/UDP/EMA are anti-overfitting
# tools whose benefit shrinks as training-set size grows") extends to a
# third, much larger and visually different dataset (300W: 3148 train
# images, natural RGB faces, vs UCL's 110 grayscale ultrasound images and
# HC18's 737). If FPN/UDP/EMA give ~0 benefit here too, that's a strong,
# thesis-worthy finding spanning two domains and three dataset scales.
#
# Everything except use_fpn/pixel_center_align/EMA matches
# face300w_deconv_v2_fpn_udp.yaml (the existing +FPN+UDP rung, already run - see
# that file for results: common=5.22/5.25%, challenging=7.75/7.85%,
# full=5.72/5.76% val-best/last). Same num_q=68, num_blocks=6, sigma=1.5,
# batch_size=4 (OOM-driven, see face300w_deconv_v2_fpn_udp.yaml), epochs=100 -
# these are still first-guess/unablated values shared across all 4 rungs
# so the FPN/UDP/EMA comparison stays apples-to-apples; only revisit them
# if ALL 4 rungs look obviously broken.
#
# use_fpn/fpn_layers and pixel_center_align are omitted entirely (not set
# to false) to match the BPD baseline config's own convention
# (bpd_deconv_v2.yaml) - EoMT/LandmarkDataset default to False/off.
# ---------------------------------------------------------------

seed_everything: 42

trainer:
  max_epochs: 100
  check_val_every_n_epoch: 2
  log_every_n_steps: 10
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: metrics/val_nme
        mode: min
        save_top_k: 1
        save_last: true
        dirpath: checkpoints/face300w-deconv-v2
        filename: face300w-deconv-v2_best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: metrics/val_nme
        mode: min
        patience: 15
        min_delta: 0.001
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: eomt-landmark
      name: face300w-deconv-v2
      save_dir: logs
      log_model: false

model:
  class_path: training.landmark_detection.LandmarkDetection
  init_args:
    num_landmarks: 68
    nme_norm_pair: [36, 45]
    loss_type: hybrid
    alpha: 5.0
    temperature: 10.0
    lambda_coord: 0.1
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: null
    attn_mask_annealing_end_steps: null
    lr: 1.0e-4
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1.0
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps: [15, 30]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_classes: 1
        num_q: 68
        num_blocks: 6
        masked_attn_enabled: true
        freeze_backbone: false
        upsample_bilinear: false
        use_refinement_head: false
        heatmap_head: deconv_v2
        heatmap_size: [64, 64]
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_reg4_dinov2

data:
  class_path: datasets.face300w_dataset.Face300WDataModule
  init_args:
    data_root: "/root/autodl-tmp/300W/300w"
    img_size: [256, 256]
    heatmap_size: [64, 64]
    sigma: 1.5
    val_fraction: 0.1
    val_split_seed: 42
    test_subset: full
    batch_size: 4
    num_workers: 4
    augment: false
    loader_seed: 42
