# ---------------------------------------------------------------
# MODIFIED: new file — Abdomen/APAD (anteroposterior abdominal diameter),
# cross-anatomy generalizability check. Added 2026-07-21 alongside tad/fl
# to extend the thesis's coverage from 2 anatomies (head: BPD/OFD) to 5
# (+ abdomen: APAD/TAD, + femur: FL), matching the supervisors' own
# multicentre benchmark table's breadth. Same UCL data source, same CSV
# schema, same images as TAD (Abdomen_Train/Test.csv has both apad_* and
# tad_* columns on the same images — same relationship as bpd/ofd sharing
# Head images). Train=94, Test=36 (verified against the actual CSV row
# counts, not just recalled).
#
# Goes straight to the "best config" (FPN+UDP + rotation+scale, matching
# HRNet's augmentation recipe) rather than a full 4-rung ablation chain —
# the mechanistic "why does each component help" question is answered on
# BPD; these datasets validate that the winning recipe transfers across
# anatomy, same role OFD plays for cross-measurement transfer.
#
# Identical to bpd_dinov2_fpn_udp_rotate_scale.yaml except: task, images_dir,
# ann_train_csv/ann_test_csv, and val_fraction/val_split_seed (kept
# identical in value — same subject-based-split *methodology*, just applied
# to this anatomy's own subject pool).
# ---------------------------------------------------------------

seed_everything: 2024

trainer:
  max_epochs: 200
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: metrics/val_nme
        mode: min
        save_top_k: 1
        save_last: true
        dirpath: checkpoints/apad-dinov2-fpn-udp-rotate-scale
        filename: apad-dinov2-fpn-udp-rotate-scale_best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: metrics/val_nme
        mode: min
        patience: 20
        min_delta: 0.005
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: eomt-landmark
      name: apad-dinov2-fpn-udp-rotate-scale
      save_dir: logs
      log_model: false

model:
  class_path: training.landmark_detection.LandmarkDetection
  init_args:
    num_landmarks: 2
    loss_type: hybrid
    alpha: 5.0
    temperature: 10.0
    lambda_coord: 0.1
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: null
    attn_mask_annealing_end_steps: null
    lr: 1.0e-4
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1.0
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps: [15, 30]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_classes: 1
        num_q: 2
        num_blocks: 3
        masked_attn_enabled: true
        freeze_backbone: false
        upsample_bilinear: false
        use_refinement_head: false
        heatmap_head: deconv_v2
        heatmap_size: [64, 64]
        use_fpn: true
        fpn_layers: [4, 8, 12]
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_reg4_dinov2

data:
  class_path: datasets.landmark_dataset.HeadLandmarkDataModule
  init_args:
    images_dir: /root/autodl-tmp/images/UCL/Abdomen
    ann_train_csv: /root/autodl-tmp/annotations/UCL/Abdomen_Train.csv
    ann_test_csv: /root/autodl-tmp/annotations/UCL/Abdomen_Test.csv
    task: apad
    img_size: [512, 512]
    heatmap_size: [64, 64]
    sigma: 4.0
    val_fraction: 0.1
    val_split_seed: 42
    batch_size: 16
    num_workers: 4
    pixel_center_align: true
    rotate_augment: true
    scale_augment: true
    loader_seed: 2024
