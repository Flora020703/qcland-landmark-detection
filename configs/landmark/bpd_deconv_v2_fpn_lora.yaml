# ---------------------------------------------------------------
# MODIFIED: Experiment 5 — LoRA + FPN + deconv_v2 (LoRA layered on FPN).
#
# Goal: once FPN fixes backbone feature under-utilisation, use LoRA to let
# the backbone itself adapt to ultrasound images instead of staying frozen
# ImageNet/general-domain DINOv2 weights.
#
# IMPORTANT: run only after bpd_deconv_v2_fpn.yaml (Experiment 4) is
# validated — LoRA is meant to layer on top of FPN, not run standalone.
#
# Server setup required before running:
#   pip install peft --break-system-packages
#
# Implementation (models/eomt.py EoMT.__init__):
#   - use_lora=true wraps encoder.backbone with peft.get_peft_model(),
#     LoraConfig(r=8, lora_alpha=16, target_modules=["qkv"], lora_dropout=0.1).
#   - get_peft_model() freezes ALL base backbone weights automatically and
#     trains only the LoRA A/B matrices (~0.3M params) — this is why
#     freeze_backbone must be false here (asserted in code): the two
#     mechanisms both decide which backbone weights train and would
#     conflict if both set.
#
# VERIFY ON FIRST RUN: target_modules=["qkv"] assumes timm's ViT Attention
# module exposes `self.qkv` directly (standard for timm vision_transformer.py,
# confirmed by reading models/vit.py + the manual attention code in
# EoMT._attn(), which calls `module.qkv(x)`). If trainable param count doesn't
# show ~0.3M LoRA params (check model.encoder.backbone.print_trainable_parameters()
# or grep param names for "lora_"), the target module name needs adjusting.
#
# Everything else identical to bpd_deconv_v2_fpn.yaml (seed=2024, FPN layers
# [4,8,12], 64x64 heatmap, hybrid loss).
# ---------------------------------------------------------------

seed_everything: 2024

trainer:
  max_epochs: 200
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: metrics/val_nme
        mode: min
        save_top_k: 1
        save_last: true
        dirpath: checkpoints/deconv-v2-fpn-lora
        filename: deconv-v2-fpn-lora_best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: metrics/val_nme
        mode: min
        patience: 20
        min_delta: 0.005
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: eomt-landmark
      name: deconv-v2-fpn-lora
      save_dir: logs
      log_model: false

model:
  class_path: training.landmark_detection.LandmarkDetection
  init_args:
    num_landmarks: 2
    loss_type: hybrid
    alpha: 5.0
    temperature: 10.0
    lambda_coord: 0.1
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: null
    attn_mask_annealing_end_steps: null
    lr: 1.0e-4
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1.0
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps: [15, 30]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_classes: 1
        num_q: 2
        num_blocks: 3
        masked_attn_enabled: true
        freeze_backbone: false
        upsample_bilinear: false
        use_refinement_head: false
        heatmap_head: deconv_v2
        heatmap_size: [64, 64]
        use_fpn: true
        fpn_layers: [4, 8, 12]
        use_lora: true
        lora_rank: 8
        lora_alpha: 16
        lora_dropout: 0.1
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_reg4_dinov2

data:
  class_path: datasets.landmark_dataset.HeadLandmarkDataModule
  init_args:
    images_dir: /root/autodl-tmp/images/UCL/Head
    ann_train_csv: /root/autodl-tmp/annotations/UCL/Head_Train.csv
    ann_test_csv: /root/autodl-tmp/annotations/UCL/Head_Test.csv
    task: bpd
    img_size: [512, 512]
    heatmap_size: [64, 64]
    sigma: 4.0
    val_fraction: 0.1
    val_split_seed: 42
    batch_size: 16
    num_workers: 4
