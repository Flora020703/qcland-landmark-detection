# ---------------------------------------------------------------
# MODIFIED: bpd_dinov3_fpn_udp_rotate.yaml + scale_augment: true.
#
# This is the "aligned with HRNet's full recipe" config for BPD: rotation
# (ROT_FACTOR=30) + scale jitter (SCALE_FACTOR=0.25) + flip, matching
# exactly what Di Vece et al.'s experiments/fetal/
# fetal_landmark_hrnet_w18_UCL_brain_BPD.yaml used to produce the 8.00%
# baseline. Deliberately NOT ablated separately from rotation — rotation
# alone was already tested (see bpd_dinov3_fpn_udp_rotate.yaml results:
# single-model last 10.74%±0.65 vs 16.86%±2.46 without rotation, but
# ensemble only 10.34%, WORSE than the no-rotation ensemble's 9.54% —
# rotation dramatically improves and stabilizes single models, but that
# same stability collapses the inter-seed disagreement the ensemble
# depends on). This config exists to answer a different, narrower
# question: under HRNet's *complete* published augmentation recipe (not
# just the rotation subset), what's the real gap to their 8.00%? Testing
# scale jitter alone first would cost a second, unnecessary 5-seed run for
# a data point nobody asked for — the only number that matters for "fair
# comparison to the published baseline" is the full recipe.
#
# Expectation set going in (from the rotation-alone result): scale jitter
# is very likely to compound the same single-model-up/ensemble-diversity-down
# pattern. If the ensemble here still doesn't beat 9.54%, that's the answer:
# EoMT's BPD ceiling is ~9.5%, and the ~1.5pt gap to HRNet's 8.00% reflects
# a real architectural/data-scale limit, not something augmentation can
# close — not a negative outcome for the thesis, a clean, well-evidenced
# boundary finding.
#
# ONLY difference from bpd_dinov3_fpn_udp_rotate.yaml: data.init_args.scale_augment.
# ---------------------------------------------------------------

seed_everything: 2024

trainer:
  max_epochs: 200
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: metrics/val_nme
        mode: min
        save_top_k: 1
        save_last: true
        dirpath: checkpoints/bpd-dinov3-fpn-udp-rotate-scale
        filename: bpd-dinov3-fpn-udp-rotate-scale_best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: metrics/val_nme
        mode: min
        patience: 20
        min_delta: 0.005
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: eomt-landmark
      name: bpd-dinov3-fpn-udp-rotate-scale
      save_dir: logs
      log_model: false

model:
  class_path: training.landmark_detection.LandmarkDetection
  init_args:
    num_landmarks: 2
    loss_type: hybrid
    alpha: 5.0
    temperature: 10.0
    lambda_coord: 0.1
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: null
    attn_mask_annealing_end_steps: null
    lr: 1.0e-4
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1.0
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps: [15, 30]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_classes: 1
        num_q: 2
        num_blocks: 3
        masked_attn_enabled: true
        freeze_backbone: false
        upsample_bilinear: false
        use_refinement_head: false
        heatmap_head: deconv_v2
        heatmap_size: [64, 64]
        use_fpn: true
        fpn_layers: [4, 8, 12]
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: facebook/dinov3-vits16-pretrain-lvd1689m

data:
  class_path: datasets.landmark_dataset.HeadLandmarkDataModule
  init_args:
    images_dir: /root/autodl-tmp/images/UCL/Head
    ann_train_csv: /root/autodl-tmp/annotations/UCL/Head_Train.csv
    ann_test_csv: /root/autodl-tmp/annotations/UCL/Head_Test.csv
    task: bpd
    img_size: [512, 512]
    heatmap_size: [64, 64]
    sigma: 4.0
    val_fraction: 0.1
    val_split_seed: 42
    batch_size: 16
    num_workers: 4
    pixel_center_align: true
    rotate_augment: true
    scale_augment: true
    loader_seed: 2024
