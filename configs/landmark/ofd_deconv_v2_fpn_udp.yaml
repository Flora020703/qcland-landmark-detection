# ---------------------------------------------------------------
# MODIFIED: OFD counterpart of bpd_deconv_v2_fpn_udp.yaml (Exp 7,
# BPD's best single-config result: val-best 13.21%±1.92% / last
# 13.67%±1.08%, and the source of the 9.75% 5-seed ensemble).
#
# Only real difference from the BPD config: data.init_args.task: ofd.
# HeadLandmarkDataModule/LandmarkDataset already select the landmark
# columns via a task string ("bpd" -> bpd_1_x/y, bpd_2_x/y; "ofd" ->
# ofd_1_x/y, ofd_2_x/y — see TASK_COLS in datasets/landmark_dataset.py).
# There is no start_col/end_col mechanism in the code; switching tasks
# is a one-line change, not a column-index change.
#
# Also enables loader_seed (see bpd_deconv_v2_fpn_udp_ema.yaml for why —
# without it, "same seed_everything" does not guarantee the same data
# order/augmentation sequence across script invocations). Exp 7 itself
# predates this fix; OFD adopts it from the start since it's now the
# standard going forward. The per-seed ablation script overrides both
# seed_everything and loader_seed together, same pattern as Exp 8a.
#
# No EMA: per the OFD task spec, this reproduces Exp 7 (FPN+UDP only),
# which is the config whose 5 raw "best" checkpoints ensemble best for
# BPD (9.75%) — EMA checkpoints ensemble worse (see docs/experiment_
# summary_exp4-9_ensemble.md §4). Same reasoning applies here.
#
# Everything else identical to bpd_deconv_v2_fpn_udp.yaml: FPN layers
# [4,8,12], 64x64 heatmap sigma=4.0, hybrid loss (lambda_coord=0.1,
# temp=10, alpha=5.0), unfrozen DINOv2-ViT-S/14 backbone, no LoRA.
# ---------------------------------------------------------------

seed_everything: 2024

trainer:
  max_epochs: 200
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: metrics/val_nme
        mode: min
        save_top_k: 1
        save_last: true
        dirpath: checkpoints/ofd-deconv-v2-fpn-udp
        filename: ofd-deconv-v2-fpn-udp_best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: metrics/val_nme
        mode: min
        patience: 20
        min_delta: 0.005
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: eomt-landmark
      name: ofd-deconv-v2-fpn-udp
      save_dir: logs
      log_model: false

model:
  class_path: training.landmark_detection.LandmarkDetection
  init_args:
    num_landmarks: 2
    loss_type: hybrid
    alpha: 5.0
    temperature: 10.0
    lambda_coord: 0.1
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: null
    attn_mask_annealing_end_steps: null
    lr: 1.0e-4
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1.0
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps: [15, 30]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_classes: 1
        num_q: 2
        num_blocks: 3
        masked_attn_enabled: true
        freeze_backbone: false
        upsample_bilinear: false
        use_refinement_head: false
        heatmap_head: deconv_v2
        heatmap_size: [64, 64]
        use_fpn: true
        fpn_layers: [4, 8, 12]
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_reg4_dinov2

data:
  class_path: datasets.landmark_dataset.HeadLandmarkDataModule
  init_args:
    images_dir: /root/autodl-tmp/images/UCL/Head
    ann_train_csv: /root/autodl-tmp/annotations/UCL/Head_Train.csv
    ann_test_csv: /root/autodl-tmp/annotations/UCL/Head_Test.csv
    task: ofd
    img_size: [512, 512]
    heatmap_size: [64, 64]
    sigma: 4.0
    val_fraction: 0.1
    val_split_seed: 42
    batch_size: 16
    num_workers: 4
    pixel_center_align: true
    loader_seed: 2024
