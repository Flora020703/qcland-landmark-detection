# ---------------------------------------------------------------
# MODIFIED: Experiment 6 (primary) — deconv_v2 + FPN + LoRA + EMA.
#
# Builds on Experiment 5 (FPN + LoRA) by adding an exponential moving
# average of weights (training/ema.py). Motivation: training curves show
# `last` checkpoint often beats val-best but is itself noisy epoch-to-epoch
# (val NME dips to 6-11% around epoch 30-60 then rises back to 16-21%) — EMA
# smooths that trajectory instead of betting on one epoch's snapshot.
#
# decay=0.99 (not the more common 0.999): UCL has ~6 steps/epoch at
# batch_size=16, so 200 epochs is only ~1200 steps total. decay=0.999 has a
# ~1000-step time constant — it would barely finish "catching up" by the end
# of training. decay=0.99 (~100-step / ~17-epoch time constant) tracks the
# current region of weight-space across a few validation intervals
# (check_val_every_n_epoch=5) without dragging in the whole trajectory,
# including the later overfit-and-rise period.
#
# IMPORTANT: EMA weights are NOT swapped in during training/validation —
# the val_nme used for checkpoint selection stays based on raw weights,
# same as every other experiment (see training/ema.py docstring for why).
# After training, materialize a testable EMA checkpoint with:
#   python3 ablation/apply_ema.py checkpoints/deconv-v2-fpn-lora-ema/seedN_final.ckpt \
#                        checkpoints/deconv-v2-fpn-lora-ema/seedN_ema.ckpt
#   python3 main_landmark.py test --config <this file> --ckpt_path checkpoints/deconv-v2-fpn-lora-ema/seedN_ema.ckpt
# (ablation/scripts/run_fpn_lora_ema_ablation.sh does this automatically per seed.)
#
# Fallback: if Experiment 5 (LoRA) shows no benefit or hurts, use
# bpd_deconv_v2_fpn_ema.yaml instead (same FPN+EMA, skips LoRA) — no other
# logic changes needed, only which base experiment EMA is layered on.
#
# Everything else identical to bpd_deconv_v2_fpn_lora.yaml (seed=2024, FPN
# layers [4,8,12], LoRA r=8/alpha=16/dropout=0.1, 64x64 heatmap).
# ---------------------------------------------------------------

seed_everything: 2024

trainer:
  max_epochs: 200
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: metrics/val_nme
        mode: min
        save_top_k: 1
        save_last: true
        dirpath: checkpoints/deconv-v2-fpn-lora-ema
        filename: deconv-v2-fpn-lora-ema_best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: metrics/val_nme
        mode: min
        patience: 20
        min_delta: 0.005
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: training.ema.EMACallback
      init_args:
        decay: 0.99
        use_warmup: true
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: eomt-landmark
      name: deconv-v2-fpn-lora-ema
      save_dir: logs
      log_model: false

model:
  class_path: training.landmark_detection.LandmarkDetection
  init_args:
    num_landmarks: 2
    loss_type: hybrid
    alpha: 5.0
    temperature: 10.0
    lambda_coord: 0.1
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: null
    attn_mask_annealing_end_steps: null
    lr: 1.0e-4
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1.0
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps: [15, 30]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_classes: 1
        num_q: 2
        num_blocks: 3
        masked_attn_enabled: true
        freeze_backbone: false
        upsample_bilinear: false
        use_refinement_head: false
        heatmap_head: deconv_v2
        heatmap_size: [64, 64]
        use_fpn: true
        fpn_layers: [4, 8, 12]
        use_lora: true
        lora_rank: 8
        lora_alpha: 16
        lora_dropout: 0.1
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_reg4_dinov2

data:
  class_path: datasets.landmark_dataset.HeadLandmarkDataModule
  init_args:
    images_dir: /root/autodl-tmp/images/UCL/Head
    ann_train_csv: /root/autodl-tmp/annotations/UCL/Head_Train.csv
    ann_test_csv: /root/autodl-tmp/annotations/UCL/Head_Test.csv
    task: bpd
    img_size: [512, 512]
    heatmap_size: [64, 64]
    sigma: 4.0
    val_fraction: 0.1
    val_split_seed: 42
    batch_size: 16
    num_workers: 4
