# ---------------------------------------------------------------
# MODIFIED: bpd_dinov3_fpn_udp.yaml + rotate_augment: true.
#
# Tests the one real remaining lever for closing the gap to HRNet's BPD
# baseline (8.00%): rotation augmentation. Confirmed via the actual HRNet
# baseline training code (Di Vece et al., experiments/fetal/
# fetal_landmark_hrnet_w18_UCL_brain_BPD.yaml) that their reported 8.00%
# was trained with ROT_FACTOR=30 (±30°, 0.6 probability) + SCALE_FACTOR=0.25
# + horizontal flip — this project's pipeline had flip+colour-jitter
# already (HeadLandmarkDataModule hardcodes augment=True for the train
# split, unconditionally, always has), but never rotation and never scale
# jitter. This config adds rotation only (matching HRNet's exact angle
# range and probability) — NOT scale jitter, which HRNet implements via a
# center+scale affine-crop architecture this project's whole-image-resize
# pipeline doesn't share; adopting it would change the input field of view
# for every sample (including non-augmented ones), breaking comparability
# with every prior BPD/OFD/300W result. See datasets/landmark_dataset.py's
# rotate_augment docstring for the exact implementation (in-place rotation
# of the already-resized image, out-of-bounds landmarks skip the rotation
# for that sample rather than clamping).
#
# ONLY difference from bpd_dinov3_fpn_udp.yaml: data.init_args.rotate_augment.
# Everything else (backbone, loss, LR schedule, FPN layers, sigma,
# loader_seed) held fixed — isolates rotation as the single new variable.
# ---------------------------------------------------------------

seed_everything: 2024

trainer:
  max_epochs: 200
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: metrics/val_nme
        mode: min
        save_top_k: 1
        save_last: true
        dirpath: checkpoints/bpd-dinov3-fpn-udp-rotate
        filename: bpd-dinov3-fpn-udp-rotate_best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: metrics/val_nme
        mode: min
        patience: 20
        min_delta: 0.005
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: eomt-landmark
      name: bpd-dinov3-fpn-udp-rotate
      save_dir: logs
      log_model: false

model:
  class_path: training.landmark_detection.LandmarkDetection
  init_args:
    num_landmarks: 2
    loss_type: hybrid
    alpha: 5.0
    temperature: 10.0
    lambda_coord: 0.1
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: null
    attn_mask_annealing_end_steps: null
    lr: 1.0e-4
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1.0
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps: [15, 30]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_classes: 1
        num_q: 2
        num_blocks: 3
        masked_attn_enabled: true
        freeze_backbone: false
        upsample_bilinear: false
        use_refinement_head: false
        heatmap_head: deconv_v2
        heatmap_size: [64, 64]
        use_fpn: true
        fpn_layers: [4, 8, 12]
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: facebook/dinov3-vits16-pretrain-lvd1689m

data:
  class_path: datasets.landmark_dataset.HeadLandmarkDataModule
  init_args:
    images_dir: /root/autodl-tmp/images/UCL/Head
    ann_train_csv: /root/autodl-tmp/annotations/UCL/Head_Train.csv
    ann_test_csv: /root/autodl-tmp/annotations/UCL/Head_Test.csv
    task: bpd
    img_size: [512, 512]
    heatmap_size: [64, 64]
    sigma: 4.0
    val_fraction: 0.1
    val_split_seed: 42
    batch_size: 16
    num_workers: 4
    pixel_center_align: true
    rotate_augment: true
    loader_seed: 2024
