# ---------------------------------------------------------------
# MODIFIED: Experiment 8b — deconv_v2 + FPN + UDP coordinate fix + 128x128 heatmap.
#
# hm128 alone (Experiment 3, 5-seed) showed no real gain over 64x64
# (15.16%±1.12% val-best vs deconv_v2 64x64's 15.18%±3.00% — same mean,
# lower val-best variance only). But the UDP naive-scaling bias
# (0.5*(1-scale), scale=hm_w/orig_w) scales with heatmap resolution — at
# hm_w=128 the bias is smaller in heatmap-pixel terms than at hm_w=64 for
# the same original image size. It's possible hm128's original "no benefit"
# result was partly masked by the SAME label-noise source UDP just fixed
# (Experiment 7 alone gave a much bigger win than the audit's conservative
# estimate predicted, precisely because it's sample-dependent noise, not a
# fixed offset). Worth re-testing 128x128 now that this noise source is
# addressed, rather than assuming hm128 is settled as "no effect".
#
# Uses loader_seed (set equal to seed_everything per seed by the ablation
# script) for deterministic reruns — see datasets/landmark_dataset.py.
#
# Everything else identical to bpd_deconv_v2_fpn_udp.yaml (seed=2024, FPN
# layers [4,8,12], pixel_center_align=true, no LoRA/EMA) except
# heatmap_size 64->128 and sigma 4.0->8.0 (kept proportional, same reasoning
# as bpd_deconv_v2_hm128.yaml).
# ---------------------------------------------------------------

seed_everything: 2024

trainer:
  max_epochs: 200
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: metrics/val_nme
        mode: min
        save_top_k: 1
        save_last: true
        dirpath: checkpoints/deconv-v2-fpn-udp-hm128
        filename: deconv-v2-fpn-udp-hm128_best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: metrics/val_nme
        mode: min
        patience: 20
        min_delta: 0.005
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: eomt-landmark
      name: deconv-v2-fpn-udp-hm128
      save_dir: logs
      log_model: false

model:
  class_path: training.landmark_detection.LandmarkDetection
  init_args:
    num_landmarks: 2
    loss_type: hybrid
    alpha: 5.0
    temperature: 10.0
    lambda_coord: 0.1
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: null
    attn_mask_annealing_end_steps: null
    lr: 1.0e-4
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1.0
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps: [15, 30]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_classes: 1
        num_q: 2
        num_blocks: 3
        masked_attn_enabled: true
        freeze_backbone: false
        upsample_bilinear: false
        use_refinement_head: false
        heatmap_head: deconv_v2
        heatmap_size: [128, 128]
        use_fpn: true
        fpn_layers: [4, 8, 12]
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_reg4_dinov2

data:
  class_path: datasets.landmark_dataset.HeadLandmarkDataModule
  init_args:
    images_dir: /root/autodl-tmp/images/UCL/Head
    ann_train_csv: /root/autodl-tmp/annotations/UCL/Head_Train.csv
    ann_test_csv: /root/autodl-tmp/annotations/UCL/Head_Test.csv
    task: bpd
    img_size: [512, 512]
    heatmap_size: [128, 128]
    sigma: 8.0
    val_fraction: 0.1
    val_split_seed: 42
    batch_size: 16
    num_workers: 4
    pixel_center_align: true
    loader_seed: 2024
