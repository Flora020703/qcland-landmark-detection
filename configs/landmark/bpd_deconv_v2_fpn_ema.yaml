# ---------------------------------------------------------------
# MODIFIED: Experiment 6 (fallback) — deconv_v2 + FPN + EMA, skips LoRA.
#
# Use this instead of bpd_deconv_v2_fpn_lora_ema.yaml if Experiment 5 (LoRA)
# shows no benefit or hurts — same FPN + EMA combination, LoRA left out.
# No other logic changes needed vs the primary exp6 config.
#
# See bpd_deconv_v2_fpn_lora_ema.yaml for the EMA decay/design rationale
# (decay=0.99, shadow not swapped in during training — see training/ema.py).
# After training, materialize a testable EMA checkpoint with:
#   python3 apply_ema.py checkpoints/deconv-v2-fpn-ema/seedN_final.ckpt \
#                        checkpoints/deconv-v2-fpn-ema/seedN_ema.ckpt
#   python3 main_landmark.py test --config <this file> --ckpt_path checkpoints/deconv-v2-fpn-ema/seedN_ema.ckpt
# (run_fpn_ema_ablation.sh does this automatically per seed.)
#
# Everything else identical to bpd_deconv_v2_fpn.yaml (seed=2024, FPN layers
# [4,8,12], 64x64 heatmap, no LoRA).
# ---------------------------------------------------------------

seed_everything: 2024

trainer:
  max_epochs: 200
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: metrics/val_nme
        mode: min
        save_top_k: 1
        save_last: true
        dirpath: checkpoints/deconv-v2-fpn-ema
        filename: deconv-v2-fpn-ema_best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: metrics/val_nme
        mode: min
        patience: 20
        min_delta: 0.005
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: training.ema.EMACallback
      init_args:
        decay: 0.99
        use_warmup: true
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: eomt-landmark
      name: deconv-v2-fpn-ema
      save_dir: logs
      log_model: false

model:
  class_path: training.landmark_detection.LandmarkDetection
  init_args:
    num_landmarks: 2
    loss_type: hybrid
    alpha: 5.0
    temperature: 10.0
    lambda_coord: 0.1
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: null
    attn_mask_annealing_end_steps: null
    lr: 1.0e-4
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1.0
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps: [15, 30]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_classes: 1
        num_q: 2
        num_blocks: 3
        masked_attn_enabled: true
        freeze_backbone: false
        upsample_bilinear: false
        use_refinement_head: false
        heatmap_head: deconv_v2
        heatmap_size: [64, 64]
        use_fpn: true
        fpn_layers: [4, 8, 12]
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_reg4_dinov2

data:
  class_path: datasets.landmark_dataset.HeadLandmarkDataModule
  init_args:
    images_dir: /root/autodl-tmp/images/UCL/Head
    ann_train_csv: /root/autodl-tmp/annotations/UCL/Head_Train.csv
    ann_test_csv: /root/autodl-tmp/annotations/UCL/Head_Test.csv
    task: bpd
    img_size: [512, 512]
    heatmap_size: [64, 64]
    sigma: 4.0
    val_fraction: 0.1
    val_split_seed: 42
    batch_size: 16
    num_workers: 4
