# ---------------------------------------------------------------
# MODIFIED: Experiment 7 — UDP-style coordinate scaling fix + FPN.
#
# UDP audit finding (datasets/landmark_dataset.py): the landmark coordinate
# rescaling (`lms[:,0] *= iw/orig_w`, and again for heatmap space) uses naive
# proportional scaling, but PIL's image resize (and PyTorch's default
# align_corners=False upsampling used elsewhere in the model) sample under
# the pixel-center convention. These two conventions differ by a systematic
# (non-random) offset of ~0.5*(1-scale) pixels at each resize stage — this is
# exactly the bug class UDP (Huang et al., CVPR 2020) documents.
#
# Measured on real UCL images (checked actual file dimensions, e.g.
# 1136x783 and 960x720 -> resized to 512x512 -> 64x64 heatmap): the combined
# orig->heatmap naive-vs-corrected offset is roughly 0.3-0.5 heatmap pixels
# (~5-8 original-image pixels, likely <1mm given px_to_mm_rate ~0.1). Small,
# systematic, and free to fix — but expect a modest effect at best: current
# noise floor (5-seed std ~2-3%) is much larger than this fix's expected
# magnitude, so don't expect this alone to move the needle much. Worth doing
# because it's a correctness fix, not because it's expected to be the next
# big lever.
#
# Applied via pixel_center_align: true (opt-in flag, default False everywhere
# else so no other experiment's results are affected).
#
# Isolated against the FPN-alone baseline (14.49% ± 2.01% val-best) rather
# than layered onto EMA/LoRA — those are still being decided; UDP is a
# data-pipeline correctness concern orthogonal to architecture choices, so
# once EMA settles, this can be combined with whichever config wins.
#
# Everything else identical to bpd_deconv_v2_fpn.yaml (seed=2024, FPN layers
# [4,8,12], 64x64 heatmap, unfrozen backbone, no LoRA/EMA).
# ---------------------------------------------------------------

seed_everything: 2024

trainer:
  max_epochs: 200
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: metrics/val_nme
        mode: min
        save_top_k: 1
        save_last: true
        dirpath: checkpoints/deconv-v2-fpn-udp
        filename: deconv-v2-fpn-udp_best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: metrics/val_nme
        mode: min
        patience: 20
        min_delta: 0.005
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: eomt-landmark
      name: deconv-v2-fpn-udp
      save_dir: logs
      log_model: false

model:
  class_path: training.landmark_detection.LandmarkDetection
  init_args:
    num_landmarks: 2
    loss_type: hybrid
    alpha: 5.0
    temperature: 10.0
    lambda_coord: 0.1
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: null
    attn_mask_annealing_end_steps: null
    lr: 1.0e-4
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1.0
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps: [15, 30]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_classes: 1
        num_q: 2
        num_blocks: 3
        masked_attn_enabled: true
        freeze_backbone: false
        upsample_bilinear: false
        use_refinement_head: false
        heatmap_head: deconv_v2
        heatmap_size: [64, 64]
        use_fpn: true
        fpn_layers: [4, 8, 12]
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_reg4_dinov2

data:
  class_path: datasets.landmark_dataset.HeadLandmarkDataModule
  init_args:
    images_dir: /root/autodl-tmp/images/UCL/Head
    ann_train_csv: /root/autodl-tmp/annotations/UCL/Head_Train.csv
    ann_test_csv: /root/autodl-tmp/annotations/UCL/Head_Test.csv
    task: bpd
    img_size: [512, 512]
    heatmap_size: [64, 64]
    sigma: 4.0
    val_fraction: 0.1
    val_split_seed: 42
    batch_size: 16
    num_workers: 4
    pixel_center_align: true
