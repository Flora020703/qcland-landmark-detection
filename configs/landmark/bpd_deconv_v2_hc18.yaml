# ---------------------------------------------------------------
# MODIFIED: Experiment 1 — HC18 (737 train / 262 test) + deconv_v2.
#
# Goal: does deconv_v2 benefit from more training data the way HRNet does
# (einsum + HC18 = 20.74%, worse than UCL — was data volume the bottleneck,
# or is einsum itself the limit)?
#
# CSV columns confirmed identical to UCL (image_name, bpd_1_x/y, bpd_2_x/y,
# ofd_1_x/y, ofd_2_x/y, px_to_mm_rate) — no code changes needed in
# datasets/landmark_dataset.py. SubjectID column is empty in the HC18 CSVs,
# but _subject_id() derives the split key from the image filename prefix
# (e.g. "009_HC.png" -> "009"), not the CSV column, and HC18 has one image
# per subject anyway, so the existing subject-split logic is equivalent to
# a random split here — no dataset code change required.
#
# Everything else identical to bpd_deconv_v2.yaml (seed=2024, hybrid loss,
# unfrozen backbone) for a fair comparison against the UCL 5-seed ablation.
#
# NOTE: HC18 train set is ~7x larger than UCL (737 vs ~110) -> far more
# gradient steps per epoch at batch_size=16. max_epochs/patience left
# unchanged below; watch wall-clock time on the first run and shorten
# max_epochs if convergence happens well before epoch 200.
# ---------------------------------------------------------------

seed_everything: 2024

trainer:
  max_epochs: 200
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: metrics/val_nme
        mode: min
        save_top_k: 1
        save_last: true
        dirpath: checkpoints/deconv-v2-hc18
        filename: deconv-v2-hc18_best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: metrics/val_nme
        mode: min
        patience: 20
        min_delta: 0.005
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: eomt-landmark
      name: deconv-v2-hc18
      save_dir: logs
      log_model: false

model:
  class_path: training.landmark_detection.LandmarkDetection
  init_args:
    num_landmarks: 2
    loss_type: hybrid
    alpha: 5.0
    temperature: 10.0
    lambda_coord: 0.1
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: null
    attn_mask_annealing_end_steps: null
    lr: 1.0e-4
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1.0
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps: [15, 30]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_classes: 1
        num_q: 2
        num_blocks: 3
        masked_attn_enabled: true
        freeze_backbone: false
        upsample_bilinear: false
        use_refinement_head: false
        heatmap_head: deconv_v2
        heatmap_size: [64, 64]
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_reg4_dinov2

data:
  class_path: datasets.landmark_dataset.HeadLandmarkDataModule
  init_args:
    images_dir: /root/autodl-tmp/images/HC18
    ann_train_csv: /root/autodl-tmp/annotations/HC18/Head_Train.csv
    ann_test_csv: /root/autodl-tmp/annotations/HC18/Head_Test.csv
    task: bpd
    img_size: [512, 512]
    heatmap_size: [64, 64]
    sigma: 4.0
    val_fraction: 0.1
    val_split_seed: 42
    batch_size: 16
    num_workers: 4
