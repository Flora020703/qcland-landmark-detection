# ---------------------------------------------------------------
# MODIFIED: OFD baseline (deconv_v2, no FPN/UDP/EMA) — DINOv2, counterpart
# of bpd_deconv_v2.yaml. Added 2026-07-21 as part of repositioning OFD as
# the paper's primary headline dataset: OFD gets its own minimal 3-point
# progression (baseline -> best config [FPN+UDP, already have 4.46%
# ensemble] -> best config + rotation+scale augmentation, currently
# running) to show a clean improvement story on the dataset that actually
# beats HRNet, without duplicating BPD's full 4-rung mechanistic ablation
# (that "why does each piece help" question is answered on BPD; OFD's job
# here is just the headline performance build-up).
#
# Only real differences from bpd_deconv_v2.yaml: data.init_args.task: ofd,
# plus loader_seed enabled from the start (bpd_deconv_v2.yaml predates the
# loader_seed fix; OFD has used it from its first config onward, same as
# ofd_deconv_v2_fpn_udp.yaml already does).
# ---------------------------------------------------------------

seed_everything: 2024

trainer:
  max_epochs: 200
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: metrics/val_nme
        mode: min
        save_top_k: 1
        save_last: true
        dirpath: checkpoints/ofd-deconv-v2
        filename: ofd-deconv-v2_best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: metrics/val_nme
        mode: min
        patience: 20
        min_delta: 0.005
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: eomt-landmark
      name: ofd-deconv-v2
      save_dir: logs
      log_model: false

model:
  class_path: training.landmark_detection.LandmarkDetection
  init_args:
    num_landmarks: 2
    loss_type: hybrid
    alpha: 5.0
    temperature: 10.0
    lambda_coord: 0.1
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: null
    attn_mask_annealing_end_steps: null
    lr: 1.0e-4
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1.0
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps: [15, 30]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_classes: 1
        num_q: 2
        num_blocks: 3
        masked_attn_enabled: true
        freeze_backbone: false
        upsample_bilinear: false
        use_refinement_head: false
        heatmap_head: deconv_v2
        heatmap_size: [64, 64]
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_reg4_dinov2

data:
  class_path: datasets.landmark_dataset.HeadLandmarkDataModule
  init_args:
    images_dir: /root/autodl-tmp/images/UCL/Head
    ann_train_csv: /root/autodl-tmp/annotations/UCL/Head_Train.csv
    ann_test_csv: /root/autodl-tmp/annotations/UCL/Head_Test.csv
    task: ofd
    img_size: [512, 512]
    heatmap_size: [64, 64]
    sigma: 4.0
    val_fraction: 0.1
    val_split_seed: 42
    batch_size: 16
    num_workers: 4
    loader_seed: 2024
