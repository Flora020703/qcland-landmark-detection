# ---------------------------------------------------------------
# MODIFIED: DINOv3 backbone counterpart of bpd_deconv_v2_fpn_udp_ema.yaml
# (BPD's best config: FPN+UDP+EMA, last=12.09%±2.74% with DINOv2-ViT-S/14).
#
# ONLY difference from bpd_deconv_v2_fpn_udp_ema.yaml: encoder.backbone_name.
# Everything else (loss, LR schedule, FPN layers, sigma, EMA decay, loader_seed
# pattern) is held fixed on purpose — this experiment isolates "DINOv2 vs
# DINOv3 backbone", not "re-tuned recipe for DINOv3". See CLAUDE.md-adjacent
# thesis notes: "不要调其他超参" (don't retune hyperparameters).
#
# backbone_name uses HF format (contains "/") so models.vit.ViT routes through
# transformers.AutoModel.from_pretrained + transformers_to_timm(), NOT
# timm.create_model. This is the exact backbone_name already used and
# validated by the upstream EoMT authors for DINOv3 segmentation configs
# (see configs/dinov3/coco/panoptic/eomt_small_640_2x.yaml) — same 21M
# ViT-S, so DeconvHead's embed_dim=384 input is unchanged.
#
# NOTE: facebook/dinov3-vits16-pretrain-lvd1689m is a GATED HF repo — you
# must have an approved access request before this config will load. The
# generic patch_size/grid_size/num_prefix_tokens/rope_embeddings handling in
# models/eomt.py and models/vit.py needs no code changes for this backbone
# swap (verified by reading eomt.py: num_upscale is computed from
# patch_embed.patch_size generically, and QueryConditionedDeconvHead's final
# F.interpolate resizes to heatmap_size regardless of incoming grid size).
#
# delta_weights is NOT set here (training.landmark_detection.LandmarkDetection
# defaults it to False) — the segmentation model-zoo configs default it to
# True because their published checkpoints are deltas on top of raw DINOv3
# weights. We are training a fresh landmark head from the raw pretrained
# backbone, so delta_weights must stay False. Do not copy `delta_weights: True`
# from any configs/dinov3/... segmentation config into this file.
# ---------------------------------------------------------------

seed_everything: 2024

trainer:
  max_epochs: 200
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: metrics/val_nme
        mode: min
        save_top_k: 1
        save_last: true
        dirpath: checkpoints/bpd-dinov3-fpn-udp-ema
        filename: bpd-dinov3-fpn-udp-ema_best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: metrics/val_nme
        mode: min
        patience: 20
        min_delta: 0.005
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: training.ema.EMACallback
      init_args:
        decay: 0.99
        use_warmup: true
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: eomt-landmark
      name: bpd-dinov3-fpn-udp-ema
      save_dir: logs
      log_model: false

model:
  class_path: training.landmark_detection.LandmarkDetection
  init_args:
    num_landmarks: 2
    loss_type: hybrid
    alpha: 5.0
    temperature: 10.0
    lambda_coord: 0.1
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: null
    attn_mask_annealing_end_steps: null
    lr: 1.0e-4
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1.0
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps: [15, 30]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_classes: 1
        num_q: 2
        num_blocks: 3
        masked_attn_enabled: true
        freeze_backbone: false
        upsample_bilinear: false
        use_refinement_head: false
        heatmap_head: deconv_v2
        heatmap_size: [64, 64]
        use_fpn: true
        fpn_layers: [4, 8, 12]
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: facebook/dinov3-vits16-pretrain-lvd1689m

data:
  class_path: datasets.landmark_dataset.HeadLandmarkDataModule
  init_args:
    images_dir: /root/autodl-tmp/images/UCL/Head
    ann_train_csv: /root/autodl-tmp/annotations/UCL/Head_Train.csv
    ann_test_csv: /root/autodl-tmp/annotations/UCL/Head_Test.csv
    task: bpd
    img_size: [512, 512]
    heatmap_size: [64, 64]
    sigma: 4.0
    val_fraction: 0.1
    val_split_seed: 42
    batch_size: 16
    num_workers: 4
    pixel_center_align: true
    loader_seed: 2024
