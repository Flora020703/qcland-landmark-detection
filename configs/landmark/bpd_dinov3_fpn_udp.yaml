# ---------------------------------------------------------------
# MODIFIED: DINOv3 backbone counterpart of bpd_deconv_v2_fpn_udp_loaderseed.yaml
# (FPN+UDP, NO EMA, loader_seed enabled — this is the "干净版" Exp7 rerun,
# last=14.68%±2.13%, and — critically — the config whose 5 val-best
# checkpoints are what actually ensemble into the 9.75% BPD headline number.
# See configs/landmark/ofd_deconv_v2_fpn_udp.yaml's comment: "EMA checkpoints
# ensemble worse" — bpd_dinov3_fpn_udp_ema.yaml has the lower single-model
# NME, but THIS config is what answers "can DINOv3 push the 9.75% ensemble
# number toward ~8%", which was the original stated motivation for doing the
# DINOv3 comparison at all. Run both — they answer different questions.
#
# ONLY difference from bpd_deconv_v2_fpn_udp_loaderseed.yaml: encoder.
# backbone_name. See bpd_dinov3_fpn_udp_ema.yaml for the full rationale on
# why no other code/config changes are needed for the DINOv2->DINOv3 swap.
# ---------------------------------------------------------------

seed_everything: 2024

trainer:
  max_epochs: 200
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: metrics/val_nme
        mode: min
        save_top_k: 1
        save_last: true
        dirpath: checkpoints/bpd-dinov3-fpn-udp
        filename: bpd-dinov3-fpn-udp_best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: metrics/val_nme
        mode: min
        patience: 20
        min_delta: 0.005
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: eomt-landmark
      name: bpd-dinov3-fpn-udp
      save_dir: logs
      log_model: false

model:
  class_path: training.landmark_detection.LandmarkDetection
  init_args:
    num_landmarks: 2
    loss_type: hybrid
    alpha: 5.0
    temperature: 10.0
    lambda_coord: 0.1
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: null
    attn_mask_annealing_end_steps: null
    lr: 1.0e-4
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1.0
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps: [15, 30]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_classes: 1
        num_q: 2
        num_blocks: 3
        masked_attn_enabled: true
        freeze_backbone: false
        upsample_bilinear: false
        use_refinement_head: false
        heatmap_head: deconv_v2
        heatmap_size: [64, 64]
        use_fpn: true
        fpn_layers: [4, 8, 12]
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: facebook/dinov3-vits16-pretrain-lvd1689m

data:
  class_path: datasets.landmark_dataset.HeadLandmarkDataModule
  init_args:
    images_dir: /root/autodl-tmp/images/UCL/Head
    ann_train_csv: /root/autodl-tmp/annotations/UCL/Head_Train.csv
    ann_test_csv: /root/autodl-tmp/annotations/UCL/Head_Test.csv
    task: bpd
    img_size: [512, 512]
    heatmap_size: [64, 64]
    sigma: 4.0
    val_fraction: 0.1
    val_split_seed: 42
    batch_size: 16
    num_workers: 4
    pixel_center_align: true
    loader_seed: 2024
