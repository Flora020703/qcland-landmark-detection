# ---------------------------------------------------------------
# MODIFIED: Experiment 4 — FPN multi-depth feature fusion + deconv_v2.
#
# Goal: DINOv2's last-layer-only output loses shallow spatial detail
# (edges/texture) that HRNet keeps via full-resolution multi-scale features.
# Fuses backbone blocks 4/8/12 (1-indexed) before the deconv_v2 head instead
# of using only the final block's patch features.
#
# Implementation (models/eomt.py):
#   - FeaturePyramidFusion module: per-level GroupNorm -> concat -> 1x1 conv
#     back to embed_dim (no top-down resizing needed — ViT blocks share one
#     spatial resolution throughout, unlike a CNN FPN).
#   - Captured directly in EoMT.forward()'s existing block loop (no
#     register_forward_hook — simpler, no hook lifecycle to manage).
#   - Initialised as an identity pass-through of the last (deepest) level
#     only, so enabling FPN doesn't perturb the proven single-layer
#     behaviour at step 0.
#   - Adds ~0.44M params (Conv2d(384*3,384,1) + 3x GroupNorm affine).
#
# Deliberately does NOT combine with heatmap 128x128 (bpd_deconv_v2_hm128.yaml)
# in this run — isolating one variable at a time vs. the deconv_v2 baseline.
# Combine only after both are validated independently.
#
# Everything else identical to bpd_deconv_v2.yaml (seed=2024, hybrid loss,
# unfrozen backbone, 64x64 heatmap) for a fair comparison.
# ---------------------------------------------------------------

seed_everything: 2024

trainer:
  max_epochs: 200
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: metrics/val_nme
        mode: min
        save_top_k: 1
        save_last: true
        dirpath: checkpoints/deconv-v2-fpn
        filename: deconv-v2-fpn_best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: metrics/val_nme
        mode: min
        patience: 20
        min_delta: 0.005
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: eomt-landmark
      name: deconv-v2-fpn
      save_dir: logs
      log_model: false

model:
  class_path: training.landmark_detection.LandmarkDetection
  init_args:
    num_landmarks: 2
    loss_type: hybrid
    alpha: 5.0
    temperature: 10.0
    lambda_coord: 0.1
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: null
    attn_mask_annealing_end_steps: null
    lr: 1.0e-4
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1.0
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps: [15, 30]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_classes: 1
        num_q: 2
        num_blocks: 3
        masked_attn_enabled: true
        freeze_backbone: false
        upsample_bilinear: false
        use_refinement_head: false
        heatmap_head: deconv_v2
        heatmap_size: [64, 64]
        use_fpn: true
        fpn_layers: [4, 8, 12]
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_reg4_dinov2

data:
  class_path: datasets.landmark_dataset.HeadLandmarkDataModule
  init_args:
    images_dir: /root/autodl-tmp/images/UCL/Head
    ann_train_csv: /root/autodl-tmp/annotations/UCL/Head_Train.csv
    ann_test_csv: /root/autodl-tmp/annotations/UCL/Head_Test.csv
    task: bpd
    img_size: [512, 512]
    heatmap_size: [64, 64]
    sigma: 4.0
    val_fraction: 0.1
    val_split_seed: 42
    batch_size: 16
    num_workers: 4
