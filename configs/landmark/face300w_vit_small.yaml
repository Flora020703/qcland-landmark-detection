# ---------------------------------------------------------------
# MODIFIED: 300W data-efficiency ablation, rung 3/4 — +FPN+UDP.
# (This file predates the 4-rung framing below; keeping its name/checkpoint
# dir as-is since a real run already completed against it - see results:
# common=5.22/5.25%, challenging=7.75/7.85%, full=5.72/5.76% val-best/last.
# See configs/landmark/face300w_deconv_v2.yaml for the full ablation
# rationale and the other 3 rungs: face300w_deconv_v2.yaml (baseline),
# face300w_deconv_v2_fpn.yaml (+FPN), face300w_deconv_v2_fpn_udp_ema.yaml
# (+FPN+UDP+EMA).)
#
# Reuses the fetal FPN+UDP recipe (Exp 7) unchanged where the architecture
# is task-agnostic; only the things that genuinely differ for 68 dense face
# points vs. 2 sparse fetal points are changed (num_q, num_blocks, heatmap
# sigma, input size, NME normaliser).
#
# Corrections applied from the 300W prompt audit (see conversation/thesis
# notes, not repeated in full here):
#   - NME normaliser is nme_norm_pair=[36,45] (outer eye corners), NOT an
#     eye-centre average - matches HRNet-Facial-Landmark-Detection's
#     lib/core/evaluation.py exactly, so numbers are comparable to the cited
#     baseline (Common 2.91 / Challenging 5.11 / Full 3.34).
#   - FLIP_PAIRS_68 in datasets/face300w_dataset.py includes (65,67), missing
#     from an earlier draft.
#   - bbox->crop uses HRNet's convention (max(w,h)*1.25 padded square crop),
#     confirmed against bounding_boxes_*.mat structure and HRNet's
#     transforms.py (`scale * 200`, `scale *= 1.25`).
#
# Tentative / first-guess values, NOT yet ablated (flag before treating as
# final): num_blocks=6 (half of DINOv2-ViT-S/14's 12 total blocks - fetal
# used 3; 68 dense points plausibly need more capacity, but this is a guess),
# sigma=1.5 (fetal's sigma=4.0 would badly overlap adjacent 64x64-heatmap
# landmarks that are only ~1-3px apart, e.g. around the eyes/mouth), epochs=100
# (fetal's 200 epochs compensates for only ~6 steps/epoch on 110 images;
# 300W's 3148 images give many more steps/epoch even at a smaller batch size,
# so far fewer epochs should suffice - unverified until a real run).
# augment=false: ship an augmentation-free baseline first (one variable at a
# time), matching the prompt's own suggested development order.
#
# [2026-07-15] batch_size dropped 16 -> 4 after a real CUDA OOM on the first
# server run (needed >18GB on a 24GB GPU during backward). num_q=68 (vs
# fetal's num_q=2) makes DeconvHead V2 produce a 68-channel heatmap instead
# of 2, and num_blocks=6 (vs fetal's 3) doubles how many transformer layers
# carry that per-query heatmap for intermediate supervision - the combined
# effect inflates heatmap-related activation memory by roughly two orders of
# magnitude vs BPD/OFD at the same batch_size. Left num_blocks=6 untouched
# (it's a real, still-unablated architecture choice, not just a memory knob)
# and only pulled the batch_size lever, which doesn't change what's being
# learned. Revisit upward (8?) once this is confirmed stable, if throughput
# matters.
#
# data_root below is the AutoDL server path. For a local CPU dry run,
# override via CLI: --data.init_args.data_root "D:/download/Project coding/msc/300w"
# ---------------------------------------------------------------

seed_everything: 42

trainer:
  max_epochs: 100
  check_val_every_n_epoch: 2
  log_every_n_steps: 10
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: metrics/val_nme
        mode: min
        save_top_k: 1
        save_last: true
        dirpath: checkpoints/face300w-baseline
        filename: face300w-baseline_best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: metrics/val_nme
        mode: min
        patience: 15
        min_delta: 0.001
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: eomt-landmark
      name: face300w-baseline
      save_dir: logs
      log_model: false

model:
  class_path: training.landmark_detection.LandmarkDetection
  init_args:
    num_landmarks: 68
    nme_norm_pair: [36, 45]
    loss_type: hybrid
    alpha: 5.0
    temperature: 10.0
    lambda_coord: 0.1
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: null
    attn_mask_annealing_end_steps: null
    lr: 1.0e-4
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1.0
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps: [15, 30]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_classes: 1
        num_q: 68
        num_blocks: 6
        masked_attn_enabled: true
        freeze_backbone: false
        upsample_bilinear: false
        use_refinement_head: false
        heatmap_head: deconv_v2
        heatmap_size: [64, 64]
        use_fpn: true
        fpn_layers: [4, 8, 12]
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_reg4_dinov2

data:
  class_path: datasets.face300w_dataset.Face300WDataModule
  init_args:
    data_root: "/root/autodl-tmp/300W/300w"
    img_size: [256, 256]
    heatmap_size: [64, 64]
    sigma: 1.5
    val_fraction: 0.1
    val_split_seed: 42
    test_subset: full
    batch_size: 4
    num_workers: 4
    pixel_center_align: true
    augment: false
    loader_seed: 42
