# ---------------------------------------------------------------
# MODIFIED: resolution screening base config — the current final adopted
# pipeline (DeconvHeadV2 + FPN + UDP + rotate+scale, DINOv2 backbone,
# hybrid loss), identical to bpd_dinov2_fpn_udp_rotate_scale.yaml except
# `data.init_args.img_size` (256x256 vs 512x512, overridden per rung by
# ablation/scripts/run_bpd_resolution_screening.sh). Single seed=2024,
# matching this project's single-seed screening convention.
#
# `data.init_args.heatmap_size` is held FIXED at [64, 64] for both rungs
# -- only input resolution is under test, not heatmap resolution (that
# axis was already tested separately, see hm128 in project memory:
# 128x128 heatmap was worse than 64x64 even after UDP).
#
# Motivation: img_size=512x512 was a one-off design decision made when
# first porting the EoMT segmentation pipeline ("align with EoMT
# convention"), never actually compared against HRNet's own 256x256 input
# resolution in a controlled experiment -- an unremoved confound in every
# EoMT-vs-HRNet comparison in this project so far. No BPD/OFD config has
# ever used 256x256 (verified 2026-07-24 -- only 300W configs do).
#
# Scope (per Rule 30 in feedback_training_pitfalls memory -- do not
# overclaim beyond exactly what is manipulated/measured here): this
# screening answers "does input resolution affect test NME under the
# CURRENT final adopted pipeline, for this one seed" -- it does NOT
# establish 512x512 (or 256x256) as formally optimal, and does NOT by
# itself remove the resolution confound from the EoMT-vs-HRNet
# comparison (that would need this to be reported as a Limitations-
# section confound either way, plus ideally the same check on more
# seeds if the result is to be leaned on for a real methodological
# claim). Report as a single-seed sensitivity check.
# ---------------------------------------------------------------

seed_everything: 2024

trainer:
  max_epochs: 200
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: metrics/val_nme
        mode: min
        save_top_k: 1
        save_last: true
        dirpath: checkpoints/bpd-resolution-screening
        filename: bpd-resolution-screening_best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: metrics/val_nme
        mode: min
        patience: 20
        min_delta: 0.005
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: eomt-landmark
      name: bpd-resolution-screening
      save_dir: logs
      log_model: false

model:
  class_path: training.landmark_detection.LandmarkDetection
  init_args:
    num_landmarks: 2
    loss_type: hybrid
    alpha: 5.0
    temperature: 10.0
    lambda_coord: 0.1
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: null
    attn_mask_annealing_end_steps: null
    lr: 1.0e-4
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1.0
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps: [15, 30]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_classes: 1
        num_q: 2
        num_blocks: 3
        masked_attn_enabled: true
        freeze_backbone: false
        upsample_bilinear: false
        use_refinement_head: false
        heatmap_head: deconv_v2
        heatmap_size: [64, 64]
        use_fpn: true
        fpn_layers: [4, 8, 12]
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_reg4_dinov2

data:
  class_path: datasets.landmark_dataset.HeadLandmarkDataModule
  init_args:
    images_dir: /root/autodl-tmp/images/UCL/Head
    ann_train_csv: /root/autodl-tmp/annotations/UCL/Head_Train.csv
    ann_test_csv: /root/autodl-tmp/annotations/UCL/Head_Test.csv
    task: bpd
    img_size: [512, 512]
    heatmap_size: [64, 64]
    sigma: 4.0
    val_fraction: 0.1
    val_split_seed: 42
    batch_size: 16
    num_workers: 4
    pixel_center_align: true
    rotate_augment: true
    scale_augment: true
    loader_seed: 2024
