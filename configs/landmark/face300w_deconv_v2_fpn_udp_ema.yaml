# ---------------------------------------------------------------
# MODIFIED: 300W data-efficiency ablation, rung 4/4 — +FPN+UDP+EMA (all
# three regularization techniques on).
#
# See face300w_deconv_v2.yaml for the full rationale. This rung completes
# the 3-technique picture (FPN, UDP, EMA) on 300W, mirroring BPD's own
# ladder (deconv_v2 -> +FPN -> +FPN+UDP -> +FPN+UDP+EMA, Exp 4/7/8a) and
# extending the "regularization gain shrinks with training-set size"
# cross-dataset comparison to all three techniques, not just FPN/UDP.
#
# EMA config (decay=0.99, not swapped into the model during training/val -
# see training/ema.py docstring) copied verbatim from
# bpd_deconv_v2_fpn_udp_ema.yaml; task-agnostic, no changes needed.
#
# Only difference from face300w_deconv_v2_fpn_udp.yaml (the +FPN+UDP rung, already
# run): the EMACallback block below.
# ---------------------------------------------------------------

seed_everything: 42

trainer:
  max_epochs: 100
  check_val_every_n_epoch: 2
  log_every_n_steps: 10
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: metrics/val_nme
        mode: min
        save_top_k: 1
        save_last: true
        dirpath: checkpoints/face300w-deconv-v2-fpn-udp-ema
        filename: face300w-deconv-v2-fpn-udp-ema_best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: metrics/val_nme
        mode: min
        patience: 15
        min_delta: 0.001
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: training.ema.EMACallback
      init_args:
        decay: 0.99
        use_warmup: true
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: eomt-landmark
      name: face300w-deconv-v2-fpn-udp-ema
      save_dir: logs
      log_model: false

model:
  class_path: training.landmark_detection.LandmarkDetection
  init_args:
    num_landmarks: 68
    nme_norm_pair: [36, 45]
    loss_type: hybrid
    alpha: 5.0
    temperature: 10.0
    lambda_coord: 0.1
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: null
    attn_mask_annealing_end_steps: null
    lr: 1.0e-4
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1.0
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps: [15, 30]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_classes: 1
        num_q: 68
        num_blocks: 6
        masked_attn_enabled: true
        freeze_backbone: false
        upsample_bilinear: false
        use_refinement_head: false
        heatmap_head: deconv_v2
        heatmap_size: [64, 64]
        use_fpn: true
        fpn_layers: [4, 8, 12]
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_reg4_dinov2

data:
  class_path: datasets.face300w_dataset.Face300WDataModule
  init_args:
    data_root: "/root/autodl-tmp/300W/300w"
    img_size: [256, 256]
    heatmap_size: [64, 64]
    sigma: 1.5
    val_fraction: 0.1
    val_split_seed: 42
    test_subset: full
    batch_size: 4
    num_workers: 4
    pixel_center_align: true
    augment: false
    loader_seed: 42
